<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarissa's Plant Tracker</title>
    <style>
        :root {
            --green: #4A5D23;
            --light-green: #6B8E23;
            --brown: #5C4033;
            --tan: #E6D5B8;
            --orange: #D97746;
            --bg-color: #C2BEB0;
            --text-dark: #3E2723;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--green);
            color: var(--tan);
            padding: 2.5rem;
            text-align: center;
            border-bottom: 6px solid var(--orange);
        }
        h1 { margin: 0; font-size: 2.8rem; letter-spacing: 1px; }
        header p { margin: 0.5rem 0 0; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
        .controls {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 1rem;
            border-bottom: 2px solid var(--tan); padding-bottom: 1rem; margin-bottom: 2rem;
        }
        .controls h2 { margin: 0; }
        .btn {
            background-color: var(--orange); color: white; border: none;
            padding: 12px 24px; border-radius: 8px; cursor: pointer;
            font-size: 1.1rem; font-weight: bold; transition: background 0.3s, transform 0.1s;
        }
        .btn:hover { background-color: var(--brown); transform: scale(1.05); }
        .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .chip {
            border: 2px solid var(--green); background: white; color: var(--green);
            padding: 6px 14px; border-radius: 999px; cursor: pointer;
            font-size: 0.95rem; font-weight: bold; transition: all 0.2s;
        }
        .chip.active { background-color: var(--green); color: var(--tan); }
        .plant-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
        }
        .plant-card {
            background-color: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            border-top: 5px solid var(--light-green);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        .plant-card:hover { transform: translateY(-8px); box-shadow: 0 12px 20px rgba(0,0,0,0.12); }
        .plant-img {
            width: 100%; height: 220px; background-color: var(--tan);
            display: flex; align-items: center; justify-content: center;
            color: var(--brown); font-style: italic;
            border-bottom: 3px solid var(--orange);
            cursor: pointer; position: relative; overflow: hidden;
        }
        .plant-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .plant-img .photo-hint { font-size: 0.95rem; opacity: 0.85; pointer-events: none; }
        .plant-img:hover .photo-hint { text-decoration: underline; }
        .modal-photo { width: 100%; height: 260px; border-radius: 10px; overflow: hidden;
            background: var(--tan); cursor: pointer; position: relative; margin-bottom: 1.4rem;
            display: flex; align-items: center; justify-content: center;
            color: var(--brown); font-style: italic; }
        .modal-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .modal-photo .photo-hint { pointer-events: none; }
        .add-form label { display: block; font-weight: bold; color: var(--brown); margin: 0.9rem 0 0.3rem; font-size: 0.95rem; }
        .add-form input, .add-form select, .add-form textarea {
            width: 100%; box-sizing: border-box; padding: 10px 12px;
            border: 2px solid var(--tan); border-radius: 8px;
            font-size: 1rem; font-family: inherit; background: white; color: var(--text-dark);
        }
        .add-form textarea { min-height: 60px; resize: vertical; }
        .add-form .save-btn { margin-top: 1.4rem; width: 100%; }
        .plant-info { padding: 1.8rem; display: flex; flex-direction: column; flex: 1; }
        .plant-title { margin: 0 0 12px 0; color: var(--brown); font-size: 1.6rem; }
        .tag {
            display: inline-block; background-color: var(--tan); color: var(--brown);
            padding: 5px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold;
            margin-right: 6px; margin-bottom: 15px;
        }
        .quick-stats { font-size: 0.95rem; line-height: 1.7; margin-bottom: 1.5rem; flex: 1; }
        .view-btn {
            display: block; width: 100%; text-align: center; background-color: var(--green);
            color: var(--tan); padding: 12px 0; text-decoration: none; border-radius: 6px;
            font-weight: bold; transition: background 0.3s; cursor: pointer; border: none;
            font-size: 1rem;
        }
        .view-btn:hover { background-color: var(--light-green); }
        .modal {
            display: none; position: fixed; inset: 0; z-index: 50;
            background: rgba(40,30,20,0.55);
        }
        .modal.open { display: block; }
        .modal-content {
            background: var(--bg-color); max-width: 720px; max-height: 88vh;
            margin: 4vh auto; border-radius: 14px; overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35); padding: 0;
        }
        .modal-head {
            background: var(--green); color: var(--tan); padding: 1.6rem 2rem;
            position: sticky; top: 0;
        }
        .modal-head h3 { margin: 0; font-size: 1.7rem; }
        .modal-head .botanical { margin: 0.3rem 0 0; font-style: italic; font-size: 1rem; color: var(--tan); }
        .close-x {
            position: absolute; top: 12px; right: 16px; background: none; border: none;
            color: var(--tan); font-size: 1.6rem; cursor: pointer;
        }
        .modal-body { padding: 1.5rem 2rem 2.5rem; }
        .care-block { background: white; border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1.4rem; box-shadow: 0 3px 8px rgba(0,0,0,0.06); }
        .care-block h4 { margin: 0 0 0.8rem; color: var(--green); font-size: 1.15rem; }
        .care-row { margin: 0.45rem 0; line-height: 1.55; font-size: 0.98rem; }
        .caution {
            background: #FDF0E7; border-left: 4px solid var(--orange);
            padding: 0.8rem 1.1rem; border-radius: 6px; font-size: 0.95rem; margin-bottom: 1.4rem;
        }
        .stage-list { list-style: none; padding: 0; margin: 0; }
        .stage-list li { padding: 0.6rem 0; border-bottom: 1px dashed var(--tan); line-height: 1.55; font-size: 0.97rem; }
        .stage-list li:last-child { border-bottom: none; }
        .stage-name { font-weight: bold; color: var(--brown); }
        .notes-log { list-style: none; padding: 0; margin: 0; }
        .notes-log li { padding: 0.6rem 0; border-bottom: 1px dashed var(--tan); font-size: 0.97rem; line-height: 1.5; }
        .notes-log li:last-child { border-bottom: none; }
        .note-date { font-weight: bold; color: var(--orange); margin-right: 0.5rem; }
        .tip { font-size: 0.9rem; color: var(--brown); opacity: 0.8; }
        @media (max-width: 640px) {
            h1 { font-size: 2rem; }
            .modal-content { margin: 2vh 8px; }
            .modal-body { padding: 1.2rem 1.2rem 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 Clarissa's Plant Journal 🌿</h1>
        <p>Documenting the growth of the backyard and the indoor jungle</p>
    </header>

    <div class="container">
        <div class="controls">
            <h2>My Collection</h2>
            <div class="filters" id="filters"></div>
            <button class="btn" id="addBtn">+ Add New Plant</button>
        </div>
        <p class="tip" id="addTip" style="display:none">Text Fo the new plant and it will land here.</p>
        <div class="plant-grid" id="grid"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-head">
                <button class="close-x" id="closeX">&times;</button>
                <h3 id="mName"></h3>
                <p class="botanical" id="mBotanical"></p>
            </div>
            <div class="modal-body" id="mBody"></div>
        </div>
    </div>

    <script src="plants.js"></script>
    <script>
        const CATEGORIES = ["All", "Indoor", "Outdoor Potted", "Planter Boxes", "In Ground"];
        let activeCat = "All";

        try {
            (JSON.parse(localStorage.getItem("pc_custom_plants") || "[]")).forEach(c => PLANTS.push(c));
        } catch (e) {}

        function renderFilters() {
            const wrap = document.getElementById("filters");
            wrap.innerHTML = "";
            CATEGORIES.forEach(cat => {
                const b = document.createElement("button");
                b.className = "chip" + (cat === activeCat ? " active" : "");
                b.textContent = cat;
                b.onclick = () => { activeCat = cat; renderFilters(); renderGrid(); };
                wrap.appendChild(b);
            });
        }

        function renderGrid() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            const shown = PLANTS.filter(p => activeCat === "All" || p.category === activeCat);
            if (shown.length === 0) {
                grid.innerHTML = "<p class='tip'>Nothing in this category yet.</p>";
                return;
            }
            shown.forEach(p => {
                const card = document.createElement("div");
                card.className = "plant-card";
                card.innerHTML =
                    "<div class='plant-img' data-pid='" + p.id + "'>" + photoHtml(p.id) + "</div>" +
                    "<div class='plant-info'>" +
                        "<h3 class='plant-title'>" + p.name + "</h3>" +
                        "<span class='tag'>" + p.ptype + "</span>" +
                        "<span class='tag'>" + p.category + "</span>" +
                        "<div class='quick-stats'>" +
                            "🪴 <strong>Soil:</strong> " + p.soil + "<br>" +
                            "☀️ <strong>Light:</strong> " + p.light + "<br>" +
                            "💧 <strong>Water:</strong> " + p.water +
                        "</div>" +
                        "<button class='view-btn'>View Full Details &amp; Log</button>" +
                    "</div>";
                card.querySelector(".view-btn").onclick = () => openModal(p);
                card.querySelector(".plant-img").onclick = () => pickPhoto(p.id);
                grid.appendChild(card);
            });
        }

        function fmtDate(iso) {
            const d = new Date(iso + "T12:00:00");
            return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
        }

        function openModal(p) {
            document.getElementById("mName").textContent = p.name;
            document.getElementById("mBotanical").textContent = p.botanical || "";
            const care =
                "<div class='modal-photo' data-pid='" + p.id + "'>" + photoHtml(p.id) + "</div>" +
                "<div class='care-block'><h4>Care</h4>" +
                    "<div class='care-row'>🪴 <strong>Soil:</strong> " + p.soil + "</div>" +
                    "<div class='care-row'>☀️ <strong>Light:</strong> " + p.light + "</div>" +
                    "<div class='care-row'>💧 <strong>Water:</strong> " + p.water + "</div>" +
                    "<div class='care-row'>🌱 <strong>Fertilizer:</strong> " + p.fert + "</div>" +
                "</div>" +
                (p.caution ? "<div class='caution'>⚠️ " + p.caution + "</div>" : "") +
                "<div class='care-block'><h4>Growth Stages</h4><ul class='stage-list'>" +
                    p.stages.map(s => "<li><span class='stage-name'>" + s[0] + ":</span> " + s[1] + "</li>").join("") +
                "</ul></div>" +
                "<div class='care-block'><h4>Dated Notes</h4><ul class='notes-log'>" +
                    p.notes.slice().sort((a,b) => b[0].localeCompare(a[0]))
                        .map(n => "<li><span class='note-date'>" + fmtDate(n[0]) + "</span>" + n[1] + "</li>").join("") +
                "</ul></div>";
            document.getElementById("mBody").innerHTML = care;
            document.querySelector(".modal-photo").onclick = () => pickPhoto(p.id);
            document.getElementById("modal").classList.add("open");
        }

        let photos = {};
        try { photos = JSON.parse(localStorage.getItem("pc_photos") || "{}"); } catch (e) { photos = {}; }
        function savePhotos() {
            try { localStorage.setItem("pc_photos", JSON.stringify(photos)); }
            catch (e) { alert("This photo is too large to save. Try a smaller one."); }
        }
        function photoHtml(pid) {
            return photos[pid]
                ? "<img src='" + photos[pid] + "' alt='plant photo'>"
                : "<span class='photo-hint'>[ 📸 tap to add a photo ]</span>";
        }

        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/*";
        fileInput.style.display = "none";
        document.body.appendChild(fileInput);
        let pickingPid = null;
        fileInput.onchange = () => {
            const f = fileInput.files[0];
            if (!f || !pickingPid) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const max = 900;
                    const scale = Math.min(1, max / Math.max(img.width, img.height));
                    const c = document.createElement("canvas");
                    c.width = Math.round(img.width * scale);
                    c.height = Math.round(img.height * scale);
                    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
                    photos[pickingPid] = c.toDataURL("image/jpeg", 0.75);
                    savePhotos();
                    renderGrid();
                    const mp = document.querySelector(".modal-photo[data-pid='" + pickingPid + "']");
                    if (mp) mp.innerHTML = photoHtml(pickingPid);
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(f);
            fileInput.value = "";
        };
        function pickPhoto(pid) { pickingPid = pid; fileInput.click(); }

        document.getElementById("closeX").onclick = () => document.getElementById("modal").classList.remove("open");
        document.getElementById("modal").onclick = (e) => {
            if (e.target.id === "modal") document.getElementById("modal").classList.remove("open");
        };
        function todayIso() {
            const d = new Date();
            return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        }

        function openAddModal() {
            document.getElementById("mName").textContent = "New Plant";
            document.getElementById("mBotanical").textContent = "";
            const ptypeOpts = ["Houseplant", "Flowering shrub", "Tree", "Succulent", "Herb", "Vegetable", "Vine", "Ground cover", "Other"];
            const catOpts = ["Indoor", "Outdoor Potted", "Planter Boxes", "In Ground"];
            document.getElementById("mBody").innerHTML =
                "<div class='add-form'>" +
                    "<label>Plant name *</label><input id='fName' type='text' placeholder='e.g. Rosemary'>" +
                    "<label>Botanical name</label><input id='fBot' type='text' placeholder='optional, e.g. Salvia rosmarinus'>" +
                    "<label>Category *</label><select id='fCat'>" + catOpts.map(c => "<option>" + c + "</option>").join("") + "</select>" +
                    "<label>Type</label><select id='fType'>" + ptypeOpts.map(t => "<option>" + t + "</option>").join("") + "</select>" +
                    "<label>Soil</label><input id='fSoil' type='text' placeholder='e.g. well-draining potting mix'>" +
                    "<label>Light</label><input id='fLight' type='text' placeholder='e.g. full sun, 6+ hours'>" +
                    "<label>Water</label><input id='fWater' type='text' placeholder='e.g. deep soak once a week'>" +
                    "<label>Fertilizer</label><input id='fFert' type='text' placeholder='optional'>" +
                    "<label>Notes</label><textarea id='fNote' placeholder='anything you want to remember about it'></textarea>" +
                    "<button class='btn save-btn' id='fSave'>Save Plant</button>" +
                "</div>";
            document.getElementById("modal").classList.add("open");
            document.getElementById("fName").focus();
            document.getElementById("fSave").onclick = () => {
                const name = document.getElementById("fName").value.trim();
                if (!name) { document.getElementById("fName").style.borderColor = "var(--orange)"; return; }
                const v = id => document.getElementById(id).value.trim();
                const plant = {
                    id: "custom-" + Date.now(),
                    name: name,
                    botanical: v("fBot"),
                    category: v("fCat"),
                    ptype: v("fType"),
                    soil: v("fSoil") || "Not set yet",
                    light: v("fLight") || "Not set yet",
                    water: v("fWater") || "Not set yet",
                    fert: v("fFert") || "Not set yet",
                    stages: [],
                    notes: [[todayIso(), v("fNote") || "Added to the journal."]]
                };
                PLANTS.push(plant);
                let custom = [];
                try { custom = JSON.parse(localStorage.getItem("pc_custom_plants") || "[]"); } catch (e) {}
                custom.push(plant);
                try { localStorage.setItem("pc_custom_plants", JSON.stringify(custom)); }
                catch (e) { alert("Could not save, this plant plus your photos are too large for this browser."); }
                renderGrid();
                openModal(plant);
            };
        }

        document.getElementById("addBtn").onclick = openAddModal;

        renderFilters();
        renderGrid();
    </script>

</body>
</html>
